# Local S3-compatible stack for development.
#
# Note: the official MinIO images were removed from Docker Hub/Quay, so this
# uses the maintained elestio/minio community mirror (verified multi-arch,
# ships both `minio` server and `mc`). Point S3_ENDPOINT_URL at
# http://localhost:9000 and boto3 talks to it exactly like real AWS S3.
services:
  minio:
    image: elestio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot helper that ensures the raw-landing bucket exists. The same image
  # provides the `mc` client, avoiding a second download.
  create-bucket:
    image: elestio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/raw-landing
      "

volumes:
  minio-data:
