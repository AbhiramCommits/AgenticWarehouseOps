name: "warehouse"
version: "1.0.0"
config-version: 2

profile: "warehouse"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Governance grants are (re)applied after every run/build/test so the
# analyst_ro restricted views never drift from the models.
on-run-end: "{{ apply_governance_grants() }}"

models:
  warehouse:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
