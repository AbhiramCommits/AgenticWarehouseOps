[project]
name = "agentic-warehouse-ops"
version = "0.1.0"
description = "A data platform that lands raw files into a warehouse, transforms them with dbt, governs PII, and exposes a tool-calling LLM agent over the governed marts."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3>=1.34",
    "dbt-core>=1.9,<2",
    "dbt-duckdb>=1.9,<2",
    "dbt-snowflake>=1.9,<2",
    "duckdb>=1.1",
    "fastapi>=0.110",
    "langchain>=0.3,<2",
    "langchain-anthropic>=0.2",
    "langchain-community>=0.3,<2",
    "langchain-openai>=0.2",
    "langgraph>=0.2,<2",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "sentence-transformers>=3.0,<6",
    "snowflake-connector-python>=3.12",
    "sqlglot>=25.0",
    "structlog>=24.1",
    "typer>=0.12",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.0",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
awo = "agentic_warehouse_ops.agent.cli:app"
generate-sources = "agentic_warehouse_ops.ingestion.generate_sources:app"
seed-minio = "agentic_warehouse_ops.ingestion.seed_minio:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_warehouse_ops"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_warehouse_ops"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore", "botocore.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
