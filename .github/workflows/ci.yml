name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy agentic_warehouse_ops

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Pytest with coverage gate (includes the DAG-import test)
        run: uv run pytest tests --cov=agentic_warehouse_ops --cov-report=term --cov-fail-under=80

  pipeline:
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Cache the sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2
      - name: Seed deterministic sources
        run: make seed
      - name: dbt parse
        run: uv run dbt parse --project-dir dbt --profiles-dir dbt
      - name: Load the eval warehouse (no S3, no Airflow, no credentials)
        run: uv run python -m agentic_warehouse_ops.evals.warehouse
      - name: dbt build (quality gate + governance_meta tests)
        run: uv run dbt build --project-dir dbt --profiles-dir dbt
      - name: Meta-completeness check (every column tagged)
        run: uv run pytest tests/test_governance.py::test_real_dbt_manifest_is_fully_tagged_and_pii_set_matches -q
      - name: Eval against the committed baseline (deterministic FakeLLM, offline)
        run: uv run awo eval --baseline artifacts/evals/baseline/summary.json
