version: 1
questions:
- id: A01
  question: How many orders were cancelled on 2026-08-30?
  category: aggregation
  difficulty: easy
  expected_tools:
  - tool: query_mart
    args:
      mart: fct_orders
      select:
      - order_id
      filters:
      - column: status
        op: eq
        value: cancelled
      - column: order_ts
        op: gte
        value: '2026-08-30T00:00:00'
      - column: order_ts
        op: lt
        value: '2026-08-31T00:00:00'
      limit: 1000
  expected_answer:
    kind: count
    value: 241
